name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'manifest.json'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check release status
        id: release
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install npm with trusted publishing support
        if: steps.release.outputs.publish == 'true'
        run: npm install --global npm@11.13.0

      - name: Verify npm supports trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: |
          npm_version="$(npm --version)"
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or later is required for trusted publishing')" "${npm_version}"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.release.outputs.publish == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.release.outputs.publish == 'true'
        run: pnpm test

      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: pnpm build

      - name: Inspect package contents
        if: steps.release.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        run: npm publish
